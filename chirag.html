<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Proposal ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff4e8a, #ff9ecb);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
  color: white;
}

.card {
  background: rgba(0,0,0,0.3);
  padding: 40px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  z-index: 2;
  max-width: 500px;
}

h1 { margin-bottom: 10px; }

button {
  padding: 12px 25px;
  margin: 10px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
}

.yes { background: #00e676; color: black; }
.no { background: #ff5252; color: white; position: relative; }

button:hover { transform: scale(1.1); }

#result {
  margin-top: 20px;
  font-size: 26px;
  display: none;
  animation: pop 0.6s ease forwards;
}

@keyframes pop {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* floating hearts */
.heart {
  position: absolute;
  color: pink;
  animation: float 6s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b1b7b9c1.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1>Hey Aastha ❤️</h1>
  <h2>From Chirag 💌</h2>
  <p>You are the most special part of my life…</p>
  <h2>Will You Be My Valentine? 💖</h2>

  <button class="yes" onclick="sayYes()">YES 😍</button>
  <button class="no" onclick="sayNo()">NO 😢</button>

  <div id="result"></div>
</div>

<script>
function sayYes() {
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = "Aastha said YES!!! 💍❤️🥳<br>Chirag is the luckiest person today!";
  startHearts();
}

function sayNo() {
  const btn = document.querySelector(".no");
  btn.style.position = "absolute";
  btn.style.left = Math.random()*80 + "%";
  btn.style.top = Math.random()*80 + "%";
}

/* heart rain */
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (20 + Math.random()*30) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 200);
}
</script>

</body>
</html>
